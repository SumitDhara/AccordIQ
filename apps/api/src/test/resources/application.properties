# Test database
spring.datasource.url=jdbc:h2:mem:accordiq_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Disable Flyway for tests
spring.flyway.enabled=false

# JWT
security.jwt.secret-key=test-secret-key-for-accordiq-tests-only-which-is-long-enough
security.jwt.expiration=86400000
security.jwt.refresh-expiration=604800000

# Gemini
gemini.api.key=test-key
gemini.model=gemini-3.6-flash
gemini.temperature=0.0

# OCR
ocr.tesseract.data-path=/tmp/tessdata
ocr.tesseract.language=eng
ocr.tesseract.engine-mode=1
ocr.tesseract.page-segmentation-mode=3

# Storage
accordiq.storage.location=target/test-uploads

# CORS
accordiq.cors.allowed-origins=http://localhost:3000

# Server
server.port=0