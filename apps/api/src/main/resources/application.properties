###########################################################
# Application
###########################################################

spring.application.name=accordiq-api

# Allow the application context to initialize lazily.
# This reduces cold-start time on Render.
spring.main.lazy-initialization=true


###########################################################
# Server
###########################################################

server.port=${PORT:8080}


###########################################################
# PostgreSQL
###########################################################

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Do not block application startup waiting indefinitely
# for the initial database connection.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000


###########################################################
# JPA / Hibernate
###########################################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


###########################################################
# File Upload
###########################################################

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB


###########################################################
# Storage
###########################################################

accordiq.storage.location=${ACCORDIQ_STORAGE_LOCATION:uploads}


###########################################################
# Actuator
###########################################################

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


###########################################################
# Error Handling
###########################################################

server.error.include-message=always


###########################################################
# OCR
###########################################################

ocr.tesseract.data-path=${OCR_TESSERACT_DATA_PATH:/opt/tesseract/tessdata}
ocr.tesseract.language=${OCR_TESSERACT_LANGUAGE:eng}
ocr.tesseract.engine-mode=${OCR_TESSERACT_ENGINE_MODE:1}
ocr.tesseract.page-segmentation-mode=${OCR_TESSERACT_PAGE_SEGMENTATION_MODE:3}


###########################################################
# Gemini
###########################################################

gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.temperature=${GEMINI_TEMPERATURE:0.0}


###########################################################
# SpringDoc / Swagger
###########################################################

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger
springdoc.default-produces-media-type=application/json


###########################################################
# JWT
###########################################################

security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration=${JWT_EXPIRATION:86400000}
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}


###########################################################
# CORS
###########################################################

accordiq.cors.allowed-origins=${ACCORDIQ_CORS_ALLOWED_ORIGINS:http://localhost:3000}


###########################################################
# Logging
###########################################################

logging.level.com.accordiq=INFO
logging.level.org.springframework.web=INFO
logging.level.net.sourceforge.tess4j=INFO